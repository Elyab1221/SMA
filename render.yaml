services:
  - type: web
    name: club-sma
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: club-sma-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: HTTPS
        value: "1"

databases:
  - name: club-sma-db
    plan: free
    databaseName: club_sma
    user: sma_admin
