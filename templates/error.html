{% extends "base.html" %}

{% block title %}Error {{ code }} - Cyber Talent SMA{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card" style="text-align: center;">
        <div class="auth-header">
            <span class="auth-icon">⚠️</span>
            <h2>Error {{ code }}</h2>
            <p>{{ message }}</p>
        </div>

        <div style="margin-top: 2rem;">
            <a href="{{ url_for('auth.landing') }}" class="btn btn-primary">
                Return to Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
