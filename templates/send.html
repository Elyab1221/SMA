{% extends "base.html" %}
{% block title %} Send a Message {% endblock %}
{% block content %}
    <h1>Send Message without your name</h1>
    <p>send a message to admins without showing your face.</p>
    <!-- <form method="POST"> -->
        <form id="form" data-csfr="{{csrf}}" method="POST" action="{{url_for('send.send_message')}}">
        <!-- <input type="hidden" name="csrf" value="{{csrf}}"> -->
        <label>your message<textarea name="text" rows="6" maxlength="1000" required></textarea></label>
        <button type="submit">Send</button>
        <p id="status" role="status"></p>
    </form>
    <script src="{{url_for('static', filename='send.js')}}"></script>
{% endblock %}
