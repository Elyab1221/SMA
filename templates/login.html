{% extends "base.html" %}

{% block title %}Sign In - Cyber Talent SMA{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <span class="auth-icon">🔐</span>
            <h2>Welcome Back</h2>
            <p>Sign in to your Cyber Talent SMA account</p>
        </div>

        <form method="POST" class="auth-form">
            <input type="hidden" name="csrf" value="{{ csrf }}">

            <div class="form-group">
                <label for="email">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="student@example.com" 
                    required 
                    autocomplete="email"
                    class="form-control"
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Enter your password" 
                    required 
                    autocomplete="current-password"
                    class="form-control"
                >
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                Sign In
            </button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account yet? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
            <p class="text-muted small">Admins must be approved by the club leader before signing in.</p>
        </div>
    </div>
</div>
{% endblock %}
